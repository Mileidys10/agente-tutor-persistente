# Igual que en Render: el agente + PostgreSQL como memoria persistente.
services:
  tutor:
    build: .
    ports:
      - "${TUTOR_PUERTO:-8001}:8000"
    environment:
      DATABASE_URL: postgresql://tutor:tutor@db:5432/tutor
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TUTOR_TOKEN: ${TUTOR_TOKEN:-}
      TUTOR_MINUTOS_POR_DIA: ${TUTOR_MINUTOS_POR_DIA:-1}
      TUTOR_INTERVALO_S: ${TUTOR_INTERVALO_S:-20}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
      POSTGRES_DB: tutor
    volumes:
      - memoria:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor"]
      interval: 5s
      retries: 10
    restart: unless-stopped
volumes:
  memoria:
